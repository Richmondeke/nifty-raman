name: Daily Fundraising News Report

on:
  schedule:
    # Runs at 8:23 AM UTC = 9:23 AM WAT (West Africa Time, UTC+1)
    - cron: '23 8 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  run-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allow committing the report file back to the repository

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser beautifulsoup4 requests gspread google-auth google-genai

      - name: Run Scraper and Upload to Sheets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          SPREADSHEET_NAME: ${{ secrets.SPREADSHEET_NAME }}
          TEMPLATED_API_KEY: ${{ secrets.TEMPLATED_API_KEY }}
          TEMPLATED_TEMPLATE_ID: ${{ secrets.TEMPLATED_TEMPLATE_ID }}
          CREATOMATE_API_KEY: ${{ secrets.CREATOMATE_API_KEY }}
          CREATOMATE_TEMPLATE_ID: ${{ secrets.CREATOMATE_TEMPLATE_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python scripts/fetch_and_upload.py

      - name: Install Postiz CLI
        run: npm install -g postiz

      - name: Schedule Social Post via Postiz
        env:
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
          POSTIZ_INTEGRATION_ID: ${{ secrets.POSTIZ_INTEGRATION_ID }}
        run: python scripts/postiz_schedule.py

      - name: Generate and Schedule Caricatures
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
          POSTIZ_INTEGRATION_ID: ${{ secrets.POSTIZ_INTEGRATION_ID }}
        run: python scripts/generate_caricatures.py
      - name: Commit and Push Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add NewsReport/
          if git diff --cached --quiet; then
            echo "No new reports generated today."
          else
            git commit -m "docs: Add daily news report $(date +'%Y-%m-%d')"
            git push
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add NewsReport/
          if git diff --cached --quiet; then
            echo "No new reports generated today."
          else
            git commit -m "docs: Add daily news report $(date +'%Y-%m-%d')"
            git push
          fi
