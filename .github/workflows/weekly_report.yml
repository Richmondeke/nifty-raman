name: Weekly Fundraising News Roundup

on:
  schedule:
    # Runs at 8:00 AM UTC = 9:00 AM WAT (West Africa Time, UTC+1) every Friday (day 5)
    - cron: '0 8 * * 5'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  run-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allow committing the report file back to the repository

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run Weekly Newsletter Roundup
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python scripts/weekly_roundup.py

      - name: Commit and Push Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add NewsReport/
          if git diff --cached --quiet; then
            echo "No new reports generated today."
          else
            git commit -m "docs: Add weekly digest html $(date +'%Y-%m-%d')"
            git push
          fi
