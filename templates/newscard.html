<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap');
    
    :root {
      --bg-primary: #ffffff;
      --accent-green: #7ed957;
      --text-black: #000000;
      --border-color: #000000;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Satoshi', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-black);
      width: 1080px;
      height: 1350px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 80px;
      position: relative;
      overflow: hidden;
    }
    
    .header {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      border-bottom: 3px solid var(--text-black);
      padding-bottom: 30px;
    }
    
    .logo-container {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background-color: #191919; /* Match logo background */
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .logo-container img {
      height: 90px;
      width: 90px;
      object-fit: contain;
      display: block;
    }
    
    .date-badge {
      background: var(--accent-green);
      color: var(--text-black);
      font-weight: 900;
      font-size: 20px;
      padding: 10px 24px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 9999px;
    }
    
    .main-content {
      position: relative;
      display: flex;
      gap: 50px;
      align-items: stretch;
      height: auto;
      min-height: 940px;
      margin: auto 0;
    }
    
    .image-panel {
      flex: 1.1;
      height: 100%;
      overflow: hidden;
      border-radius: 32px;
      background: #fafafa;
    }
    
    .image-panel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    
    .detail-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px 0;
    }
    
    .spotlight-tag {
      font-size: 18px;
      font-weight: 900;
      color: var(--text-black);
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }
    
    .startup-name {
      font-size: 60px;
      font-weight: 900;
      letter-spacing: -2px;
      color: var(--text-black);
      line-height: 1.05;
      margin-bottom: 25px;
    }
    
    .metrics-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .metric-row {
      border-left: 5px solid var(--accent-green);
      padding-left: 15px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    
    .metric-label {
      font-size: 12px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 900;
    }
    
    .metric-value {
      font-size: 18px;
      font-weight: 900;
      color: var(--text-black);
    }
    
    .summary-box {
      border-top: 2px solid #eee;
      padding-top: 25px;
      margin-top: 25px;
    }
    
    .summary-text {
      font-size: 18px;
      line-height: 1.5;
      color: var(--text-black);
      font-weight: 500;
    }
    
    .cta-btn {
      font-size: 24px;
      color: var(--text-black);
      background: var(--accent-green);
      padding: 14px 36px;
      font-weight: 900;
      letter-spacing: 0.5px;
      border-radius: 9999px;
      text-transform: uppercase;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      margin-top: 20px;
    }
    
    .footer {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 3px solid var(--text-black);
      padding-top: 30px;
      width: 100%;
    }
    
    .footer-text {
      font-size: 18px;
      color: var(--text-black);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .footer-link {
      font-size: 20px;
      color: var(--text-black);
      background: var(--accent-green);
      padding: 6px 16px;
      font-weight: 700;
      text-decoration: none;
      letter-spacing: 0.5px;
      border-radius: 9999px;
    }
  </style>
  <title>Newscard Template</title>
</head>
<body>
  <div class="header">
    <div class="logo-container">
      <img src="{logo_path}" alt="The Investor">
    </div>
    <div class="date-badge">{date}</div>
  </div>
  
  <div class="main-content">
    <div class="image-panel">
      <img src="{deal_image}" alt="Deal Image">
    </div>
    
    <div class="detail-panel">
      <div>
        <div class="spotlight-tag">Deal Spotlight</div>
        <div class="startup-name">{startup}</div>
        
        <div class="metrics-list">
          <div class="metric-row">
            <span class="metric-label">Amount Raised</span>
            <span class="metric-value">{amount}</span>
          </div>
          <div class="metric-row">
            <span class="metric-label">Funding Stage</span>
            <span class="metric-value">{stage}</span>
          </div>
          <div class="metric-row">
            <span class="metric-label">Sector</span>
            <span class="metric-value">{industry}</span>
          </div>
          <div class="metric-row">
            <span class="metric-label">Key Investors</span>
            <span class="metric-value">{investors}</span>
          </div>
        </div>
      </div>
      
      <div>
        <div class="summary-box">
          <p class="summary-text">{summary}</p>
        </div>
        <a href="#" class="cta-btn">View Full Deal</a>
      </div>
    </div>
  </div>
  
  <div class="footer">
    <span class="footer-text">Daily Private Capital & Events Briefing</span>
    <span class="footer-link">The Investor</span>
  </div>
</body>
</html>
