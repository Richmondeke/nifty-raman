<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap');
    
    :root {
      --bg-primary: #000000;
      --accent-green: #7ed957;
      --text-white: #ffffff;
      --border-color: #7ed957;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Satoshi', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-white);
      width: 1080px;
      height: 1350px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 80px;
      position: relative;
      overflow: hidden;
    }
    
    .header {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      border-bottom: 3px solid var(--border-color);
      padding-bottom: 30px;
    }
    
    .logo-container {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 3px solid var(--border-color);
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .logo-container img {
      height: 80px;
      width: 80px;
      object-fit: contain;
      display: block;
    }
    
    .date-badge {
      border: 3px solid var(--border-color);
      background: var(--accent-green);
      color: #000000;
      font-weight: 900;
      font-size: 20px;
      padding: 10px 24px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 9999px;
    }
    
    .main-content {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 30px;
      margin: auto 0;
    }
    
    .featured-image-container {
      width: 100%;
      height: 380px;
      overflow: hidden;
      border: 3px solid var(--border-color);
      border-radius: 20px;
      background: #111111;
    }
    
    .featured-image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    
    .spotlight-tag {
      font-size: 22px;
      font-weight: 900;
      color: var(--accent-green);
      text-transform: uppercase;
      letter-spacing: 3px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .spotlight-tag::after {
      content: '';
      flex-grow: 1;
      height: 3px;
      background: var(--border-color);
    }
    
    .startup-name {
      font-size: 72px;
      font-weight: 900;
      letter-spacing: -2px;
      color: var(--text-white);
      line-height: 1.0;
      margin: 10px 0;
    }
    
    .metrics-pills {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    
    .metric-pill {
      background: #000000;
      border: 2px solid var(--border-color);
      border-radius: 9999px;
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .metric-pill.highlight {
      background: var(--accent-green);
      border-color: var(--accent-green);
    }
    
    .metric-pill.highlight .metric-label,
    .metric-pill.highlight .metric-value {
      color: #000000;
    }
    
    .metric-label {
      font-size: 13px;
      color: var(--accent-green);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 900;
    }
    
    .metric-value {
      font-size: 22px;
      font-weight: 900;
      color: var(--text-white);
      text-align: right;
    }
    
    .summary-card {
      background: #111111;
      border: 3px solid var(--border-color);
      border-radius: 20px;
      padding: 24px 30px;
    }
    
    .summary-text {
      font-size: 24px;
      line-height: 1.5;
      color: var(--text-white);
      font-weight: 500;
    }
    
    .footer {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 3px solid var(--border-color);
      padding-top: 30px;
      width: 100%;
    }
    
    .footer-text {
      font-size: 18px;
      color: var(--text-white);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .footer-link {
      font-size: 20px;
      color: #000000;
      background: var(--accent-green);
      border: 3px solid var(--border-color);
      padding: 6px 16px;
      font-weight: 700;
      text-decoration: none;
      letter-spacing: 0.5px;
      border-radius: 9999px;
    }
  </style>
  <title>Breaking News Card Template</title>
</head>
<body>
  <div class="header">
    <div class="logo-container">
      <img src="{logo_path}" alt="The Investor">
    </div>
    <div class="date-badge">Breaking News</div>
  </div>
  
  <div class="main-content">
    <div class="featured-image-container">
      <img src="{deal_image}" alt="Deal Image">
    </div>
    
    <div>
      <div class="spotlight-tag">Alert Flash</div>
      <div class="startup-name">{startup}</div>
    </div>
    
    <div class="metrics-pills">
      <div class="metric-pill highlight">
        <span class="metric-label">Amount Raised</span>
        <span class="metric-value">{amount}</span>
      </div>
      <div class="metric-pill">
        <span class="metric-label">Funding Stage</span>
        <span class="metric-value">{stage}</span>
      </div>
      <div class="metric-pill">
        <span class="metric-label">Sector</span>
        <span class="metric-value">{industry}</span>
      </div>
      <div class="metric-pill">
        <span class="metric-label">Key Investors</span>
        <span class="metric-value">{investors}</span>
      </div>
    </div>
    
    <div class="summary-card">
      <p class="summary-text">{summary}</p>
    </div>
  </div>
  
  <div class="footer">
    <span class="footer-text">The Investor Breaking Capital Alert</span>
    <span class="footer-link">theinvestor.news</span>
  </div>
</body>
</html>
