<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billionaire Spotlight & Investor Quote</title>
  <style>
    @import url('https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap');
    
    :root {
      --bg-black: #0d0d0d;
      --card-bg: #151515;
      --border-color: #222222;
      --text-white: #ffffff;
      --text-muted: #888888;
      --accent-green: #7ED957;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Satoshi', Arial, sans-serif;
      background-color: var(--bg-black);
      color: var(--text-white);
      width: 1080px;
      height: 1350px;
      padding: 60px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 30px;
    }
    
    .logo-container {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background-color: #191919;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .logo-container img {
      height: 90px;
      width: 90px;
      object-fit: contain;
      display: block;
    }
    
    .date-badge {
      background: var(--accent-green);
      color: #000000;
      font-weight: 900;
      padding: 12px 28px;
      font-size: 18px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .main-content {
      position: relative;
      display: flex;
      gap: 50px;
      align-items: stretch;
      height: auto;
      min-height: 940px;
      margin: auto 0;
    }
    
    .portrait-panel {
      flex: 1.1;
      height: 100%;
      position: relative;
      overflow: hidden;
      border-radius: 32px;
      background: #161616;
      border: 1px solid var(--border-color);
    }
    
    .portrait-panel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%) contrast(110%);
      display: block;
    }
    
    .portrait-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 40%;
      background: linear-gradient(to top, rgba(13,13,13,0.9), transparent);
    }
    
    .detail-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px 0;
    }
    
    .spotlight-tag {
      font-size: 18px;
      font-weight: 900;
      color: var(--accent-green);
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }
    
    .person-name {
      font-size: 54px;
      font-weight: 900;
      letter-spacing: -2px;
      color: var(--text-white);
      line-height: 1.05;
      margin-bottom: 8px;
    }
    
    .person-title {
      font-size: 20px;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 30px;
    }
    
    .stats-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 40px;
    }
    
    .stat-row {
      border-left: 3px solid var(--accent-green);
      padding-left: 15px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    
    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 900;
    }
    
    .stat-value {
      font-size: 20px;
      font-weight: 900;
      color: var(--text-white);
    }
    
    .quote-box {
      border-top: 1px solid var(--border-color);
      padding-top: 30px;
      position: relative;
    }
    
    .quote-icon {
      font-size: 72px;
      font-family: Georgia, serif;
      color: var(--accent-green);
      opacity: 0.15;
      position: absolute;
      top: -10px;
      left: 0;
      line-height: 1;
    }
    
    .quote-text {
      font-size: 22px;
      line-height: 1.6;
      color: var(--text-white);
      font-weight: 500;
      font-style: italic;
      position: relative;
      z-index: 1;
      padding-left: 10px;
    }
    
    .footer {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border-color);
      padding-top: 30px;
      width: 100%;
    }
    
    .footer-text {
      font-size: 18px;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .footer-link {
      font-size: 20px;
      color: #000000;
      background: var(--accent-green);
      padding: 6px 16px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-container">
      <img src="{logo_uri}" alt="The Investor Logo">
    </div>
    <span class="date-badge">{date}</span>
  </div>
  
  <div class="main-content">
    <div class="portrait-panel">
      <img src="{portrait_image}" alt="{person_name}">
      <div class="portrait-overlay"></div>
    </div>
    
    <div class="detail-panel">
      <div>
        <div class="spotlight-tag">Billionaire Spotlight</div>
        <div class="person-name">{person_name}</div>
        <div class="person-title">{person_title}</div>
        
        <div class="stats-container">
          <div class="stat-row">
            <span class="stat-label">Net Worth</span>
            <span class="stat-value">{net_worth}</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Source</span>
            <span class="stat-value">{source_wealth}</span>
          </div>
        </div>
      </div>
      
      <div class="quote-box">
        <div class="quote-icon">“</div>
        <p class="quote-text">{quote}</p>
      </div>
    </div>
  </div>
  
  <div class="footer">
    <span class="footer-text">The Investor Insights & Quotations</span>
    <span class="footer-link">The Investor</span>
  </div>
</body>
</html>
