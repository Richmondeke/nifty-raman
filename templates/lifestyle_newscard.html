<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap');
    
    :root {
      --bg-primary: #ffffff;
      --accent-green: #7ed957;
      --text-black: #000000;
      --border-color: #000000;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Satoshi', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-black);
      width: 1080px;
      height: 1350px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 80px;
      position: relative;
      overflow: hidden;
    }
    
    .header {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      border-bottom: 3px solid var(--text-black);
      padding-bottom: 30px;
    }
    
    .logo-container {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background-color: #191919; /* Match logo background */
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .logo-container img {
      height: 90px;
      width: 90px;
      object-fit: contain;
      display: block;
    }
    
    .date-badge {
      background: var(--accent-green);
      color: var(--text-black);
      font-weight: 900;
      font-size: 20px;
      padding: 10px 24px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 9999px;
    }
    
    .main-content {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 30px;
      margin: auto 0;
    }
    
    .image-frame {
      position: relative;
      width: 100%;
      height: 520px;
      overflow: hidden;
      border-radius: 32px;
      background: #fafafa;
    }
    
    .image-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    
    .price-pill {
      position: absolute;
      top: 30px;
      right: 30px;
      background: var(--accent-green);
      color: var(--text-black);
      border-radius: 9999px;
      font-size: 24px;
      font-weight: 900;
      padding: 12px 28px;
    }
    
    .segment-tag {
      font-size: 20px;
      font-weight: 900;
      color: var(--text-black);
      text-transform: uppercase;
      letter-spacing: 3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .segment-tag::after {
      content: '';
      flex-grow: 1;
      height: 1px;
      background: var(--text-black);
      opacity: 0.15;
    }
    
    .item-name {
      font-size: 56px;
      font-weight: 900;
      letter-spacing: -1.5px;
      color: var(--text-black);
      line-height: 1.1;
    }
    
    .meta-details {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #eeeeee;
      border-bottom: 1px solid #eeeeee;
      padding: 20px 0;
      margin: 10px 0;
    }
    
    .meta-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    
    .meta-label {
      font-size: 11px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 900;
    }
    
    .meta-value {
      font-size: 22px;
      font-weight: 900;
    }
    
    .description-box {
      font-size: 22px;
      line-height: 1.5;
      color: var(--text-black);
      font-weight: 500;
    }
    
    .footer {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #eeeeee;
      padding-top: 30px;
      width: 100%;
    }
    
    .footer-text {
      font-size: 18px;
      color: var(--text-black);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .footer-link {
      font-size: 20px;
      color: var(--text-black);
      background: var(--accent-green);
      padding: 6px 16px;
      font-weight: 700;
      text-decoration: none;
      letter-spacing: 0.5px;
      border-radius: 9999px;
    }
  </style>
  <title>Lifestyle Showcase Card</title>
</head>
<body>
  <div class="header">
    <div class="logo-container">
      <img src="{logo_path}" alt="The Investor">
    </div>
    <div class="date-badge">Lifestyle</div>
  </div>
  
  <div class="main-content">
    <div class="image-frame">
      <img src="{item_image}" alt="Luxury Showcase">
      <div class="price-pill">{price}</div>
    </div>
    
    <div>
      <div class="segment-tag">{category} Showcase</div>
      <div class="item-name">{item_name}</div>
    </div>
    
    <div class="meta-details">
      <div class="meta-item">
        <span class="meta-label">Maker / Brand</span>
        <span class="meta-value">{maker}</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Model / Ref</span>
        <span class="meta-value">{model}</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Specification</span>
        <span class="meta-value">{spec_val_1}</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Details</span>
        <span class="meta-value">{spec_val_2}</span>
      </div>
    </div>
    
    <div class="description-box">
      {description}
    </div>
  </div>
  
  <div class="footer">
    <span class="footer-text">The Investor Luxury & Lifestyle Segment</span>
    <span class="footer-link">The Investor</span>
  </div>
</body>
</html>
