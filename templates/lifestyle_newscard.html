<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap');
    
    :root {
      --bg-primary: #0a0a0a;
      --accent-gold: #d4af37;
      --text-white: #ffffff;
      --border-color: #d4af37;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Satoshi', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-white);
      width: 1080px;
      height: 1350px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 80px;
      position: relative;
      overflow: hidden;
    }
    
    .header {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      border-bottom: 3px solid var(--border-color);
      padding-bottom: 40px;
    }
    
    .logo-container {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 3px solid var(--border-color);
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .logo-container img {
      height: 100px;
      width: 100px;
      object-fit: contain;
      display: block;
    }
    
    .price-badge {
      border: 3px solid var(--border-color);
      background: var(--accent-gold);
      color: #000000;
      font-weight: 900;
      font-size: 20px;
      padding: 10px 24px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .main-content {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 40px;
      margin: auto 0;
    }
    
    .featured-image-container {
      width: 100%;
      height: 400px;
      overflow: hidden;
      border: 3px solid var(--border-color);
      background: #151515;
    }
    
    .featured-image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    
    .segment-tag {
      font-size: 24px;
      font-weight: 900;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 3px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .segment-tag::after {
      content: '';
      flex-grow: 1;
      height: 3px;
      background: var(--border-color);
    }
    
    .item-name {
      font-size: 64px;
      font-weight: 900;
      letter-spacing: -1px;
      color: var(--text-white);
      line-height: 1.1;
    }
    
    .specs-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }
    
    .spec-card {
      background: #151515;
      border: 3px solid var(--border-color);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .spec-card.highlight {
      background: var(--accent-gold);
      color: #000000;
    }
    
    .spec-label {
      font-size: 14px;
      color: var(--text-white);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
    }
    
    .spec-card.highlight .spec-label {
      color: #000000;
    }
    
    .spec-value {
      font-size: 32px;
      font-weight: 900;
      color: var(--text-white);
    }
    
    .spec-card.highlight .spec-value {
      color: #000000;
    }
    
    .description-card {
      background: #151515;
      border: 3px solid var(--border-color);
      padding: 24px;
    }
    
    .description-text {
      font-size: 24px;
      line-height: 1.5;
      color: var(--text-white);
      font-weight: 500;
    }
    
    .footer {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 3px solid var(--border-color);
      padding-top: 40px;
      width: 100%;
    }
    
    .footer-text {
      font-size: 18px;
      color: var(--text-white);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .footer-link {
      font-size: 20px;
      color: #000000;
      background: var(--accent-gold);
      border: 3px solid var(--border-color);
      padding: 6px 16px;
      font-weight: 700;
      text-decoration: none;
      letter-spacing: 0.5px;
    }
  </style>
  <title>Lifestyle Showcase Card</title>
</head>
<body>
  <div class="header">
    <div class="logo-container">
      <img src="{logo_path}" alt="The Investor">
    </div>
    <div class="price-badge">{price}</div>
  </div>
  
  <div class="main-content">
    <div class="featured-image-container">
      <img src="{item_image}" alt="Luxury Showcase">
    </div>
    
    <div class="segment-tag">{category} Showcase</div>
    <div class="item-name">{item_name}</div>
    
    <div class="specs-grid">
      <div class="spec-card highlight">
        <span class="spec-label">Maker / Brand</span>
        <span class="spec-value">{maker}</span>
      </div>
      <div class="spec-card">
        <span class="spec-label">Model / Ref</span>
        <span class="spec-value">{model}</span>
      </div>
      <div class="spec-card">
        <span class="spec-label">Key Specification</span>
        <span class="spec-value">{spec_val_1}</span>
      </div>
      <div class="spec-card">
        <span class="spec-label">Additional Detail</span>
        <span class="spec-value">{spec_val_2}</span>
      </div>
    </div>
    
    <div class="description-card">
      <p class="description-text">{description}</p>
    </div>
  </div>
  
  <div class="footer">
    <span class="footer-text">The Investor Luxury & Lifestyle Segment</span>
    <span class="footer-link">theinvestor.news</span>
  </div>
</body>
</html>
