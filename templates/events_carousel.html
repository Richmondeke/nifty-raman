<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap');
    
    :root {
      --bg-primary: #ffffff;
      --accent-green: #7ed957;
      --text-black: #000000;
      --border-color: #000000;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Satoshi', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-black);
      width: 1080px;
      height: 1350px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 80px;
      position: relative;
      overflow: hidden;
    }
    
    .header {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      border-bottom: 3px solid var(--text-black);
      padding-bottom: 30px;
    }
    
    .logo-container {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 3px solid var(--text-black);
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .logo-container img {
      height: 80px;
      width: 80px;
      object-fit: contain;
      display: block;
    }
    
    .date-badge {
      border: 3px solid var(--text-black);
      background: var(--accent-green);
      color: var(--text-black);
      font-weight: 700;
      font-size: 20px;
      padding: 10px 24px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 9999px;
    }
    
    .main-content {
      position: relative;
      display: flex;
      align-items: stretch;
      border: 4px solid var(--text-black);
      border-radius: 24px;
      background: #ffffff;
      overflow: hidden;
      height: 800px;
      box-shadow: 8px 8px 0px var(--text-black);
      margin: auto 0;
    }
    
    .ticket-main {
      flex: 1.8;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    
    .ticket-stub {
      flex: 1;
      background: #fafafa;
      border-left: 4px dashed var(--text-black);
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }
    
    .section-tag {
      font-size: 16px;
      font-weight: 900;
      color: var(--text-black);
      text-transform: uppercase;
      letter-spacing: 3px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    
    .section-tag::after {
      content: '';
      flex-grow: 1;
      height: 3px;
      background: var(--text-black);
    }
    
    .event-title {
      font-size: 54px;
      font-weight: 900;
      letter-spacing: -1.5px;
      color: var(--text-black);
      line-height: 1.1;
      margin-bottom: 20px;
    }
    
    .details-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }
    
    .detail-card {
      display: flex;
      justify-content: space-between;
      border-bottom: 2px solid #eaeaea;
      padding-bottom: 8px;
    }
    
    .detail-label {
      font-size: 13px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 900;
    }
    
    .detail-value {
      font-size: 20px;
      font-weight: 900;
      text-align: right;
    }
    
    .description-box {
      font-size: 20px;
      line-height: 1.5;
      color: var(--text-black);
      font-weight: 500;
      background: #fafafa;
      padding: 20px;
      border: 2px solid var(--text-black);
      border-radius: 12px;
    }
    
    .stub-header {
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    
    .stub-barcode {
      width: 100%;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin: 20px 0;
    }
    
    .barcode-line {
      background: #000;
      height: 100%;
    }
    
    .stub-badge {
      font-size: 24px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: var(--accent-green);
      border: 3px solid var(--text-black);
      padding: 10px 20px;
      border-radius: 9999px;
      display: inline-block;
      box-shadow: 4px 4px 0px var(--text-black);
    }
    
    .footer {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 3px solid var(--text-black);
      padding-top: 30px;
      width: 100%;
    }
    
    .footer-text {
      font-size: 18px;
      color: var(--text-black);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .footer-link {
      font-size: 20px;
      color: var(--text-black);
      background: var(--accent-green);
      border: 3px solid var(--text-black);
      padding: 6px 16px;
      font-weight: 700;
      text-decoration: none;
      letter-spacing: 0.5px;
      border-radius: 9999px;
    }
  </style>
  <title>Events Showcase Card</title>
</head>
<body>
  <div class="header">
    <div class="logo-container">
      <img src="{logo_path}" alt="The Investor">
    </div>
    <div class="date-badge">Featured Event</div>
  </div>
  
  <div class="main-content">
    <div class="ticket-main">
      <div>
        <div class="section-tag">Access Briefing</div>
        <div class="event-title">{event_title}</div>
      </div>
      
      <div class="details-grid">
        <div class="detail-card">
          <span class="detail-label">Organizer</span>
          <span class="detail-value">{organizer}</span>
        </div>
        <div class="detail-card">
          <span class="detail-label">Date & Time</span>
          <span class="detail-value">{date_time}</span>
        </div>
        <div class="detail-card">
          <span class="detail-label">Location / City</span>
          <span class="detail-value">{location}</span>
        </div>
        <div class="detail-card">
          <span class="detail-label">Venue</span>
          <span class="detail-value">{venue}</span>
        </div>
      </div>
      
      <div class="description-box">
        {description}
      </div>
    </div>
    
    <div class="ticket-stub">
      <div class="stub-header">Admit One</div>
      
      <div class="stub-barcode">
        <!-- Mock barcode using simple lines -->
        <div class="barcode-line" style="width: 4px;"></div>
        <div class="barcode-line" style="width: 2px;"></div>
        <div class="barcode-line" style="width: 8px;"></div>
        <div class="barcode-line" style="width: 1px;"></div>
        <div class="barcode-line" style="width: 3px;"></div>
        <div class="barcode-line" style="width: 6px;"></div>
        <div class="barcode-line" style="width: 2px;"></div>
        <div class="barcode-line" style="width: 8px;"></div>
        <div class="barcode-line" style="width: 4px;"></div>
        <div class="barcode-line" style="width: 1px;"></div>
        <div class="barcode-line" style="width: 3px;"></div>
        <div class="barcode-line" style="width: 5px;"></div>
        <div class="barcode-line" style="width: 2px;"></div>
        <div class="barcode-line" style="width: 7px;"></div>
      </div>
      
      <div class="stub-badge">VIP INVITE</div>
    </div>
  </div>
  
  <div class="footer">
    <span class="footer-text">Daily Private Capital & Events Briefing</span>
    <span class="footer-link">theinvestor.news</span>
  </div>
</body>
</html>
